  services:
    webdev-mysql:
      image: mysql:8.0
      container_name: bencalo_motoworks_finals_mysql
      restart: unless-stopped
      environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_DATABASE: ${MYSQL_DATABASE}
        MYSQL_USER: ${MYSQL_USER}
        MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      ports:
        - "3311:3306"
      volumes:
        - bencalo_motoworks_finals_db_data:/var/lib/mysql
      networks:
        - bencalo_motoworks_finals_network

    webdev-phpmyadmin:
      image: phpmyadmin
      container_name: bencalo_motoworks_finals_phpmyadmin
      restart: unless-stopped
      environment:
        PMA_HOST: bencalo_motoworks_finals_mysql
      ports:
        - "8084:80"
      networks:
        - bencalo_motoworks_finals_network

  volumes:
    bencalo_motoworks_finals_db_data:

  networks:
    bencalo_motoworks_finals_network:
